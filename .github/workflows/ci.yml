name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build + test (GoalKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        working-directory: Packages/GoalKit
        run: swift build
      - name: Test
        working-directory: Packages/GoalKit
        run: swift test

  xcodebuild:
    name: xcodebuild (iOS app + iMessage extension)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Tandem.xcodeproj \
            -scheme Tandem \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
